name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ".\AutoUpdateDemo\AutoUpdateDemo.csproj"

      - name: Build
        run: dotnet build ".\AutoUpdateDemo\AutoUpdateDemo.csproj" --configuration Release --no-restore

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk

      - name: Publish Windows
        shell: pwsh
        run: |
          dotnet publish ".\AutoUpdateDemo\AutoUpdateDemo.csproj" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            --self-contained true `
            -r win-x64 `
            -o ".\publish"

      - name: Download previous Velopack release
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --outputDir ".\Releases"

      - name: Pack Velopack release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          vpk pack `
            --packId "AutoUpdateDemo" `
            --packVersion "$version" `
            --packDir ".\publish" `
            --mainExe "AutoUpdateDemo.exe" `
            --outputDir ".\Releases"

      - name: Upload GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          vpk upload github `
            --outputDir ".\Releases" `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --publish `
            --merge `
            --releaseName "AutoUpdateDemo $version" `
            --tag "${{ github.ref_name }}" `
            --token "$env:GITHUB_TOKEN"