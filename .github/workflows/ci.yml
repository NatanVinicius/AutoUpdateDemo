name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AutoUpdateDemo.sln -r win-x64

      - name: Build
        run: dotnet build AutoUpdateDemo.sln --configuration Release --no-restore -r win-x64