name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI
        run: dotnet restore AutoUpdateDemo/AutoUpdateDemo.csproj -r win-x64

      - name: Build MAUI
        run: dotnet build AutoUpdateDemo/AutoUpdateDemo.csproj --configuration Release --no-restore

      - name: Publish MAUI
        run: dotnet publish AutoUpdateDemo/AutoUpdateDemo.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 --no-restore --output ./publish -p:PublishReadyToRun=false

      - name: Publish Updater
        run: dotnet publish AutoUpdateDemo.Updater/AutoUpdateDemo.Updater.csproj --configuration Release --output ./publish

      - name: Create package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/* `
            -DestinationPath ./AutoUpdateDemo-${{ github.ref_name }}.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoUpdateDemo-${{ github.ref_name }}.zip