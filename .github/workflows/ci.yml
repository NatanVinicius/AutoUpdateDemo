name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI
        run: dotnet restore AutoUpdateDemo/AutoUpdateDemo.csproj -r win-x64

      - name: Build MAUI
        run: dotnet build AutoUpdateDemo/AutoUpdateDemo.csproj --configuration Release --no-restore

      - name: Build Updater
        run: dotnet build AutoUpdateDemo.Updater/AutoUpdateDemo.Updater.csproj --configuration Release

      - name: Publish MAUI
        run: dotnet publish AutoUpdateDemo/AutoUpdateDemo.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 --no-restore --output ./publish -p:PublishReadyToRun=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoUpdateDemo
          path: ./publish